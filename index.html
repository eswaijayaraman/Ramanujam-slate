<div id="app"></div>
<script>(function(){"use strict";
/* ===== Question generators for Ramanujan's Slate ===== */
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[ri(0, a.length - 1)];
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = ri(0, i); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const ds = n => String(n).split('').reduce((s, c) => s + (+c), 0);
const isSq = n => Number.isInteger(Math.sqrt(n));
const norm = s => String(s).trim().replace(/\s+/g, '').toLowerCase();
const NAMES = ['Ravi', 'Meena', 'Arun', 'Kavya', 'Anbu', 'Lakshmi', 'Karthik', 'Divya', 'Selvi', 'Murugan'];
const pickNames = k => shuffle(NAMES).slice(0, k);
const THINGS = [['mangoes', '🥭'], ['marbles', '🔵'], ['stickers', '⭐'], ['balloons', '🎈'], ['pencils', '✏️'], ['books', '📘']];
const SKILL_IDS = ['number', 'place', 'addsub', 'pattern', 'logic', 'muldiv', 'geo', 'word'];
const rep = (n, ch) => Array(n).fill(ch).join('');

function Q(skill, level, o) { return Object.assign({ skill, level, type: 'mc' }, o); }
function numOpts(ans, spread) {
  const set = new Set([ans]);
  const cands = shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans + (spread || 5), ans - (spread || 5), ans + 3, ans - 3]);
  for (const c of cands) { if (c >= 0 && set.size < 4) set.add(c); }
  let k = 1; while (set.size < 4) { set.add(ans + 10 + k++); }
  return shuffle([...set]).map(String);
}
function mcNum(skill, level, text, ans, o) { o = o || {}; return Q(skill, level, Object.assign({ text, answer: String(ans), options: numOpts(ans, o.spread) }, o)); }
function nm(skill, level, text, ans, o) { return Q(skill, level, Object.assign({ text, answer: String(ans), type: 'num' }, o || {})); }
function mc(skill, level, text, ans, opts, o) { return Q(skill, level, Object.assign({ text, answer: String(ans), options: shuffle([...new Set(opts.map(String))]) }, o || {})); }

/* ---------- visuals ---------- */
const groupsPic = (g, per, ch) => '<div class="slate pic">' + Array.from({ length: g }, () => '<span class="grp">' + rep(per, ch) + '</span>').join('') + '</div>';
const arrayPic = (r, c, ch) => '<div class="slate pic">' + Array.from({ length: r }, () => '<div>' + rep(c, ch) + '</div>').join('') + '</div>';
function shapesPic(counts) {
  const items = []; Object.keys(counts).forEach(k => { for (let i = 0; i < counts[k]; i++) items.push(k); });
  const sh = shuffle(items), cols = 6; let out = '';
  sh.forEach((k, i) => {
    const x = (i % cols) * 48 + 28, y = Math.floor(i / cols) * 48 + 28;
    if (k === 'tri') out += `<polygon points="${x},${y - 18} ${x + 19},${y + 16} ${x - 19},${y + 16}" class="f1"/>`;
    if (k === 'sq') out += `<rect x="${x - 16}" y="${y - 16}" width="32" height="32" class="f2"/>`;
    if (k === 'circ') out += `<circle cx="${x}" cy="${y}" r="17" class="f3"/>`;
  });
  const rows = Math.ceil(sh.length / cols);
  return `<div class="slate pic"><svg class="fig" viewBox="0 0 ${cols * 48 + 8} ${rows * 48 + 8}" role="img" aria-label="Shapes: ${counts.tri} triangles, ${counts.sq} squares, ${counts.circ} circles">${out}</svg></div>`;
}
function gridPic(c, r) {
  const s = Math.min(46, Math.floor(260 / Math.max(c, r))); let out = '';
  for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) out += `<rect x="${j * s + 4}" y="${i * s + 4}" width="${s}" height="${s}" class="gridc"/>`;
  return `<div class="slate pic"><svg class="fig" viewBox="0 0 ${c * s + 8} ${r * s + 8}" role="img" aria-label="A grid ${c} across and ${r} down">${out}</svg></div>`;
}
const cluesPic = clues => '<div class="slate"><ul class="clues">' + clues.map(c => '<li>' + c + '</li>').join('') + '</ul></div>';

/* ---------- Mystery number (unique solution, clues generated) ---------- */
function mystery(level) {
  const cfg = { 1: [1, 20, 2], 2: [10, 50, 3], 3: [20, 99, 4] }[level];
  const [lo, hi, minClues] = cfg;
  for (let attempt = 0; attempt < 400; attempt++) {
    const n = ri(lo, hi);
    let cand = []; for (let x = lo; x <= hi; x++) cand.push(x);
    const clues = []; let prev = cand;
    for (let step = 0; step < 6 && cand.length > 1; step++) {
      const pool = [];
      pool.push(n % 2 === 0 ? { t: 'It is an even number.', f: x => x % 2 === 0 } : { t: 'It is an odd number.', f: x => x % 2 === 1 });
      if (n > lo) { const v = ri(lo, n - 1); pool.push({ t: `It is greater than ${v}.`, f: x => x > v }); }
      if (n < hi) { const v = ri(n + 1, hi); pool.push({ t: `It is less than ${v}.`, f: x => x < v }); }
      if (level >= 2 && n >= 10) {
        const s = ds(n); pool.push({ t: `Its digits add up to ${s}.`, f: x => ds(x) === s });
        const t = Math.floor(n / 10), o = n % 10;
        pool.push({ t: `Its tens digit is ${t}.`, f: x => Math.floor(x / 10) === t });
        pool.push({ t: `Its ones digit is ${o}.`, f: x => x % 10 === o });
        if (n % 5 === 0) pool.push({ t: 'You say it when you count in 5s.', f: x => x % 5 === 0 });
      }
      if (level >= 3) {
        if (n % 3 === 0) pool.push({ t: 'It is in the 3 times table.', f: x => x % 3 === 0 });
        if (Math.floor(n / 10) > n % 10) pool.push({ t: 'Its tens digit is bigger than its ones digit.', f: x => Math.floor(x / 10) > x % 10 });
        if (isSq(n)) pool.push({ t: 'It is a square number.', f: x => isSq(x) });
      }
      const useful = pool.filter(c => cand.filter(c.f).length < cand.length);
      if (!useful.length) break;
      const c = pick(useful); prev = cand; cand = cand.filter(c.f); clues.push(c);
    }
    if (cand.length !== 1 || cand[0] !== n || clues.length < minClues || clues.length > 5) continue;
    let others = prev.filter(x => x !== n);
    others = shuffle(others).slice(0, 3);
    while (others.length < 3) { const x = ri(lo, hi); if (x !== n && !others.includes(x)) others.push(x); }
    const q = mc('logic', level, 'What is the mystery number?', n, [n].concat(others), {
      visual: cluesPic(clues.map(c => c.t)),
      hint: 'Cross out numbers that break the first clue. Then use the next clue.',
      why: `Only ${n} follows every clue.`, mystery: true
    });
    q._verify = () => { let c = []; for (let x = lo; x <= hi; x++) if (clues.every(k => k.f(x))) c.push(x); return c.length === 1 && c[0] === n; };
    return q;
  }
  return mc('logic', level, 'Which number is even and bigger than 6?', 8, [8, 5, 3, 6], { hint: 'Even numbers end in 0, 2, 4, 6 or 8.', why: '8 is even and bigger than 6.' });
}

/* ---------- Elimination (who has what) ---------- */
function permutations(a) { if (a.length <= 1) return [a]; const out = []; a.forEach((x, i) => permutations(a.slice(0, i).concat(a.slice(i + 1))).forEach(p => out.push([x].concat(p)))); return out; }
function elimination(level) {
  const k = level >= 3 ? 4 : 3;
  const people = pickNames(k);
  const items = [['cat', '🐱'], ['dog', '🐶'], ['parrot', '🦜'], ['fish', '🐟']].slice(0, k);
  const all = permutations(items.map((_, i) => i));
  let perm, sols, clues;
  for (let tries = 0; tries < 200; tries++) {
    perm = shuffle(items.map((_, i) => i)); sols = all.slice(); clues = [];
    let guard = 0;
    while (sols.length > 1 && guard++ < 60 && clues.length < 7) {
      const p = ri(0, k - 1), it = ri(0, k - 1);
      if (perm[p] === it) continue;
      const next = sols.filter(s => s[p] !== it);
      if (next.length === sols.length) continue;
      sols = next; clues.push(`${people[p]} does not have the ${items[it][0]} ${items[it][1]}.`);
    }
    if (sols.length === 1) break;
  }
  const target = ri(0, k - 1);
  const itIdx = perm[target];

  });
  q._verify = () => sols.length === 1 && sols[0][target] === itIdx;

}

/* ---------- Odd one out by rule ---------- */
const PROPS = [
  { n: 'even numbers', f: x => x % 2 === 0 }, { n: 'odd numbers', f: x => x % 2 === 1 },
  { n: 'numbers in the 5 times table', f: x => x % 5 === 0 }, { n: 'numbers in the 3 times table', f: x => x % 3 === 0 },
  { n: 'square numbers', f: isSq }, { n: 'numbers in the 4 times table', f: x => x % 4 === 0 }
];
function oddOneOut(level) {
  const pool = level === 2 ? PROPS.slice(0, 3) : PROPS, lo = level === 2 ? 2 : 10, hi = level === 2 ? 40 : 99;
  for (let a = 0; a < 300; a++) {
    const p = pick(pool); const yes = [], no = [];
    for (let x = lo; x <= hi; x++) (p.f(x) ? yes : no).push(x);
    if (yes.length < 3 || !no.length) continue;
    const three = shuffle(yes).slice(0, 3), od = pick(no), set = shuffle(three.concat(od));
    let ok = true;
    for (const pr of PROPS) { const c = set.filter(pr.f); if (c.length === 3) { const odd = set.find(x => !pr.f(x)); if (odd !== od) ok = false; } if (c.length === 1) { if (c[0] !== od) ok = false; } }
    if (!ok) continue;
    return mc('logic', level, 'Which number does not belong with the others?', od, set, { hint: 'Look for something the other three numbers share.', why: `${three.join(', ')} are all ${p.n}. ${od} is not.` });
  }
  return trueFalse(level);
}

    Object.keys(bySkill).forEach(s => { const b = bySkill[s]; if (b[1].done && b[2].done && b[3].done) { const l = !b[1].correct ? 1 : !b[2].correct ? 1 : !b[3].correct ? 2 : 3; S.levels[s] = l; S.diag[s] = { t: Date.now(), level: l, r: [b[1].correct, b[2].correct, b[3].correct] }; r.sum.changes.push(`${SK[s].name}: starting stage ${l} (${STAGES[l]})`); } });
  } else if (r.mode === 'weekly') {
    const items = r.qs.map(q => ({ part: q.part, skill: q.track, correct: q.st.correct, text: q.text.replace(/\s+/g, ' '), answer: q.answer, given: q.st.given }));
    S.weekly.push({ t: Date.now(), week: r.meta.week, topic: WEEKS[r.meta.week - 1][1], score: correct, total: r.qs.length, items });
  } else {
    const grp = {}; r.qs.filter(q => q.part !== 'Warm-up' && q.st.done).forEach(q => { const g = grp[q.track] = grp[q.track] || { n: 0, c: 0 }; g.n++; if (q.st.correct && q.st.att === 1 && !q.st.hint) g.c++; });
    Object.keys(grp).forEach(s => { const g = grp[s]; if (g.n < 3) return; const rate = g.c / g.n; if (rate >= 0.75 && lv(s) < 3) { S.levels[s] = lv(s) + 1; r.sum.changes.push(`${SK[s].name} moved up to stage ${lv(s)} (${STAGES[lv(s)]}).`); } else if (rate <= 0.34 && lv(s) > 1) { S.levels[s] = lv(s) - 1; r.sum.changes.push(`${SK[s].name} moved to stage ${lv(s)} so the child can build confidence.`); } });
  }
  S.sessions.push({ t: Date.now(), mode: r.mode, skill: r.meta.skill || '', week: r.meta.week || null, total: answered.length, correct, clean, hints, mins });
  S.sessions = S.sessions.slice(-120); save(); r.done = true; render(); window.scrollTo(0, 0);
}

/* ----- run ----- */
function renderRun() {
  if (run.done) return renderSummary();
  const q = cur(), st = q.st, assess = isAssess(), last = run.i === run.qs.length - 1;
  const dots = run.qs.map((x, i) => `<i class="${x.st.done ? (assess || x.st.correct ? 'on' : 'miss') : ''} ${i === run.i ? 'cur' : ''}"></i>`).join('');
  let ans;
  if (q.type === 'mc') ans = `<div class="opts">${q.options.map(o => { const tried = st.wrongs.includes(o), right = st.done && !assess && norm(o) === norm(q.answer), picked = assess && st.done && st.given === o; return `<button class="opt ${tried ? 'tried' : ''} ${right ? 'right' : ''} ${picked ? 'picked' : ''}" data-act="opt" data-v="${esc(o)}" ${st.done || tried ? 'disabled' : ''}>${esc(o)}</button>`; }).join('')}</div>`;
  else ans = `<div class="numrow"><input id="ans" inputmode="numeric" autocomplete="off" aria-label="Your answer" value="${esc(st.draft)}" ${st.done ? 'disabled' : ''}><button class="btn primary" data-act="check" ${st.done ? 'disabled' : ''}>Check</button></div>`;
  let hint = '';
  if (!assess && !st.done) hint = st.hint ? `<p class="hint"><b>Hint:</b> ${esc(q.hint)}</p>` : `<button class="btn sm" data-act="hint">Give me a hint</button>`;
  let fb = '';
  if (assess) { if (st.done) fb = '<div class="fb neutral">Answer saved.</div>'; }
  else if (st.done && st.correct) fb = `<div class="fb good"><b>${PRAISE[run.i % PRAISE.length]}</b> ${esc(q.why)}</div>`;
  else if (st.done) fb = `<div class="fb warn"><b>The answer is ${esc(q.answer)}.</b> ${esc(q.why)}</div>`;
  else if (st.att === 1) fb = '<div class="fb warn">Not quite yet. Look again. A hint is open for you.</div>';
  const needExp = q.explain && st.done && !st.expDone && (assess || st.correct);
  const exp = needExp ? `<div class="explain"><h4>How did you know?</h4><div class="chips">${EXP_CHIPS.map((c, i) => `<button class="chip" data-act="chip" data-v="${i}" aria-pressed="${st.chips.includes(i)}">${c}</button>`).join('')}</div><label class="l" for="expText">Tell your teacher in your own words (optional)</label><textarea id="expText">${esc(st.expText)}</textarea><div class="row" style="margin-top:10px"><button class="btn primary" data-act="expSave">Save my explanation</button><button class="link" data-act="expSkip">Skip</button></div></div>` : '';
  const next = st.done && !needExp ? `<button class="btn primary" data-act="next">${last ? 'Finish' : 'Next question'}</button>` : '';
  const leave = V.leaving ? `<div class="leave" role="alert"><p><b>Stop for now?</b> ${run.mode === 'weekly' ? 'This weekly check will not be saved.' : 'Your answers so far are saved.'}</p><div class="row"><button class="btn sm" data-act="leaveNo">Keep going</button><button class="btn sm primary" data-act="leaveYes">Stop</button></div></div>` : '';
  return `${leave}<div class="runhead"><div><span class="pill">${esc(q.part)}</span> <span class="muted small">${esc(run.meta.title || '')} · ${run.i + 1} of ${run.qs.length}</span></div><div class="dots" aria-hidden="true">${dots}</div><button class="link" data-act="leave">Stop</button></div>
  <div class="card">${q.visual || ''}<p class="qtext">${esc(q.text)}</p>${ans}${hint}${fb}${exp}<div class="row">${next}</div></div>`;
}

function focusList() {
  return SKILLS.map(s => { const r = lastRec(s.id), h = hist(s.id); let why = '', pr = 9;
    if (!S.diag[s.id] && !h.n && !r) { why = 'No evidence yet. Run the skill check.'; pr = 0; }
    else if (r && r.total < 9) { why = 'Latest score is under 9. Identify the difficulty and reteach.'; pr = 1; }

  <label class="l" for="rSupport">Level of support needed</label><select id="rSupport">${SUPPORT.map(s => `<option>${s}</option>`).join('')}</select>
  <label class="l" for="rObs" style="margin-top:12px">Teacher's observation</label><textarea id="rObs" placeholder="Example: Identifies the pattern correctly but needs help explaining the rule."></textarea>
  <div class="row" style="margin-top:12px"><button class="btn primary" data-act="addRec">Add assessment record</button>${V.msg ? `<span class="tag good">${esc(V.msg)}</span>` : ''}</div>
  <p class="muted small" style="margin-top:10px">Bands: 17–20 ready for more challenge · 13–16 practise unfamiliar applications · 9–12 revisit with concrete objects · below 9 reteach. These are classroom guidelines, not standardised scores.</p></div>
  <h3>Records</h3>${recs.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>Date</th><th>Skill</th><th class="num">Score</th><th>Support</th><th>Observation</th><th></th></tr></thead><tbody>${recs.map((r, i) => { const idx = S.records.length - 1 - i; return `<tr><td>${fd(r.t)}<br><span class="muted small">${esc(r.ctx)}</span></td><td>${SK[r.skill].name}</td><td class="num"><b>${r.total}</b></td><td>${esc(r.support)}</td><td>${esc(r.obs) || '—'}<br><span class="muted small">${band(r.total)}</span></td><td>${V.confirm === 'rec' + idx ? `<button class="btn sm primary" data-act="delRecYes" data-v="${idx}">Delete</button> <button class="link" data-act="cancel">Cancel</button>` : `<button class="link" data-act="delRec" data-v="${idx}">Delete</button>`}</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="muted">No records yet.</p>'}`;
}
function tLog() {
  const t = (rows, head, empty) => rows.length ? `<div class="scroll"><table class="tbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>` : `<p class="muted">${empty}</p>`;
  const modeName = { practice: 'Practice', mystery: 'Mystery puzzles', diag: 'Skill check', weekly: 'Weekly check' };
  return `<h3 style="margin-top:0">Sessions</h3>${t(S.sessions.slice(-15).reverse().map(s => `<tr><td>${fd(s.t)}</td><td>${modeName[s.mode] || s.mode}${s.skill && SK[s.skill] ? ' · ' + SK[s.skill].name : ''}${s.week ? ' · Week ' + s.week : ''}</td><td class="num">${s.correct}/${s.total}</td><td class="num">${s.clean}</td><td class="num">${s.hints}</td><td class="num">${s.mins}</td></tr>`), ['Date', 'Type', 'Correct', 'First try', 'Hints', 'Min'], 'No sessions yet.')}
  <h3>Weekly checks</h3>${t(S.weekly.slice().reverse().map(w => `<tr><td>${fd(w.t)}</td><td>Week ${w.week} · ${esc(w.topic)}</td><td class="num">${w.score}/${w.total}</td><td>${w.items.map(i => `${esc(i.part)} ${i.correct ? '✓' : '✗'}`).join(' · ')}</td></tr>`), ['Date', 'Topic', 'Score', 'Parts'], 'No weekly checks yet.')}
  <h3>How the child explained</h3>${t(S.expl.slice(-12).reverse().map(e => `<tr><td>${fd(e.t)}</td><td>${SK[e.skill] ? SK[e.skill].name : ''}</td><td>${esc(e.q)}</td><td>${e.chips.map(esc).join(', ') || '—'}${e.text ? '<br><i>' + esc(e.text) + '</i>' : ''}</td></tr>`), ['Date', 'Skill', 'Question', 'Explanation'], 'No explanations saved yet.')}
  <h3>Puzzles the child made</h3>${t(S.made.slice(-10).reverse().map(m => `<tr><td>${fd(m.t)}</td><td>${SK[m.skill] ? SK[m.skill].name : 'Mixed'}</td><td>${esc(m.text)}</td></tr>`), ['Date', 'Skill', 'Puzzle'], 'Nothing made yet.')}
  <h3>Monthly tasks</h3>${t(S.tasks.slice().reverse().map(k => `<tr><td>${fd(k.t)}</td><td>${esc(k.name)}</td><td>${esc(k.summary)}</td></tr>`), ['Date', 'Task', 'Result'], 'No tasks saved yet.')}
  <h3>Questions to revisit</h3><p class="muted small">Recent wrong answers. Look for patterns before choosing what to reteach.</p>${t(S.wrong.slice(-15).reverse().map(w => `<tr><td>${fd(w.t)}</td><td>${SK[w.skill] ? SK[w.skill].name : ''}</td><td>${esc(w.text)}</td><td>${esc(w.given)}</td><td><b>${esc(w.answer)}</b></td></tr>`), ['Date', 'Skill', 'Question', 'Child said', 'Correct'], 'No wrong answers recorded.')}`;
}
function reportText() {
  const L = [`Logic Maths progress report: ${S.name}`, `Date: ${new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}`, '', 'SKILLS'];
  SKILLS.forEach(s => { const r = lastRec(s.id), h = hist(s.id), d = S.diag[s.id]; L.push(`- ${s.name}: stage ${lv(s.id)} (${STAGES[lv(s.id)]})${d ? ', skill check ' + d.r.map(x => x ? 'pass' : 'miss').join('/') : ''}${h.n ? `, correct ${h.acc}%, alone ${h.solo}%` : ''}${r ? `, latest score ${r.total}/20, ${r.support}` : ''}`); });
  L.push('', 'ASSESSMENT RECORDS'); S.records.forEach(r => L.push(`- ${fd(r.t)} · ${SK[r.skill].name} · ${r.total}/20 · ${r.ctx} · ${r.support}${r.obs ? ' · ' + r.obs : ''}`)); if (!S.records.length) L.push('- none');
  L.push('', 'WEEKLY CHECKS'); S.weekly.forEach(w => L.push(`- ${fd(w.t)} · Week ${w.week} ${w.topic} · ${w.score}/${w.total}`)); if (!S.weekly.length) L.push('- none');
  L.push('', 'SUGGESTED NEXT FOCUS'); focusList().slice(0, 2).forEach(x => L.push(`- ${x.s.name}: ${x.why}`));
  L.push('', 'Bands are classroom guidelines, not standardised scores.'); return L.join('\n');
}
function tTools() {
  return `<div class="card"><h4>Progress report</h4><p>Copy a text summary to share or keep.</p><div class="row"><button class="btn primary" data-act="copyReport">Copy report</button><button class="btn" data-act="showReport">${V.report ? 'Hide' : 'Show'} report</button>${V.msg ? `<span class="tag good">${esc(V.msg)}</span>` : ''}</div>${V.report ? `<pre class="rep" id="repBox" style="margin-top:12px">${esc(reportText())}</pre>` : ''}</div>
  <div class="card" style="margin-top:14px"><h4>Where this is saved</h4><p>Progress is saved in this browser on this device. It does not move to other devices. Copy the report if you want a permanent record.</p></div>
  <div class="card" style="margin-top:14px"><h4>Start again</h4><p>Removes all levels, records and logs from this browser.</p>${V.confirm === 'reset' ? `<div class="row"><button class="btn primary" data-act="resetYes">Yes, delete everything</button><button class="btn" data-act="cancel">Cancel</button></div>` : `<button class="btn" data-act="reset">Delete all progress</button>`}</div>`;
}

/* ---------- render & events ---------- */
function render() {
  const app = $('app'); let body;
  if (run) body = renderRun(); else if (V.tab === 'practice') body = renderHome(); else if (V.tab === 'check') body = renderCheck(); else body = renderTeacher();
  app.innerHTML = `<div class="wrap">${header()}<main>${body}</main></div>`;
  if (run && !run.done && run.qs[run.i].type === 'num' && !run.qs[run.i].st.done) { const a = $('ans'); if (a && !a.value) a.focus(); }
}
function updateRubric() {
  let t = 0; DIMS.forEach(d => { const c = document.querySelector(`input[name="d_${d[0]}"]:checked`); t += c ? +c.value : 0; });
  const e = $('rTotal'); if (e) e.textContent = t + ' / 20'; const b = $('rBand'); if (b) b.textContent = band(t); return t;
}
function copyText(t) { try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(() => true, () => false); } catch (e) { } return Promise.resolve(false); }
const flash = m => { V.msg = m; render(); setTimeout(() => { if (V.msg === m) { V.msg = ''; render(); } }, 2600); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT') return;
  const a = el.dataset.act, v = el.dataset.v; V.msg = V.msg && ['saveMade', 'bondsSave', 'shopSave', 'shopDone', 'detectSave', 'makerSave', 'addRec', 'copyReport'].includes(a) ? V.msg : '';
  switch (a) {
    case 'tab': V.tab = v; V.task = null; render(); window.scrollTo(0, 0); break;
    case 'tt': V.tt = v; V.confirm = null; render(); break;
    case 'start': { if (v === 'mystery') startRun('mystery', buildMysteryQs(), { title: 'Mystery puzzles', skill: 'logic' }); else startRun('practice', buildPractice(v), { title: v === 'mixed' ? "Today's practice" : SK[v].name, skill: v }); break; }
    case 'practiceSkill': V.tab = 'practice'; if (v === 'mixed') startRun('practice', buildPractice('mixed'), { title: "Today's practice", skill: 'mixed' }); else startRun('practice', buildPractice(v), { title: SK[v].name, skill: v }); break;
    case 'diag': { const ids = v === 'all' ? SKILL_IDS : [v]; startRun('diag', buildDiag(ids), { title: v === 'all' ? 'Skill check' : 'Skill check · ' + SK[v].name }); break; }
    case 'weekly': startRun('weekly', buildWeekly(V.wk), { title: 'Weekly check · Week ' + V.wk, week: V.wk }); break;
    case 'opt': submit(v); break;
    case 'check': { const i = $('ans'); if (i) submit(i.value); break; }
    case 'hint': cur().st.hint = true; { const i = $('ans'); if (i) cur().st.draft = i.value; } render(); break;
    case 'chip': { const st = cur().st, n = +v; st.chips = st.chips.includes(n) ? st.chips.filter(x => x !== n) : st.chips.concat(n); render(); break; }
    case 'expSave': { const q = cur(), st = q.st, t = $('expText'); st.expText = t ? t.value : ''; S.expl.push({ t: Date.now(), skill: q.track, q: q.text.replace(/\s+/g, ' '), chips: st.chips.map(i => EXP_CHIPS[i]), text: st.expText.trim() }); S.expl = S.expl.slice(-60); if (!isAssess()) S.stars++; st.expDone = true; save(); render(); break; }
    case 'expSkip': cur().st.expDone = true; render(); break;
    case 'next': if (run.i < run.qs.length - 1) { run.i++; render(); window.scrollTo(0, 0); } else endRun(false); break;
    case 'leave': V.leaving = true; render(); break;
    case 'leaveNo': V.leaving = false; render(); break;
    case 'leaveYes': V.leaving = false; if (run.mode === 'weekly' || !run.qs.some(q => q.st.done)) { run = null; render(); } else endRun(true); break;
    case 'home': run = null; V.tab = 'practice'; V.msg = ''; render(); window.scrollTo(0, 0); break;
    case 'saveMade': { const t = $('made'); if (t && t.value.trim()) { S.made.push({ t: Date.now(), skill: run.meta.skill, text: t.value.trim() }); S.stars += 2; save(); flash('Saved. +2 stars'); } break; }
    case 'task': V.task = v; V.bonds = null; V.shop = { items: [], baskets: [] }; render(); break;
    case 'taskBack': V.task = null; render(); break;
    case 'bondsCheck': { const text = $('bondsText').value, seen = new Set(), bad = []; let valid = 0, dups = 0; text.split('\n').map(x => x.trim()).filter(Boolean).forEach(line => { if (!/^\d+(\s*\+\s*\d+)+$/.test(line)) { bad.push(line); return; } const nums = line.split('+').map(x => +x.trim()); if (nums.reduce((p, c) => p + c, 0) !== 20) { bad.push(line); return; } const sig = nums.slice().sort((p, c) => p - c).join('+'); if (seen.has(sig)) dups++; else { seen.add(sig); valid++; } }); V.bonds = { text, valid, dups, bad }; render(); break; }
    case 'bondsSave': { const b = V.bonds; S.tasks.push({ t: Date.now(), name: 'Make 20', summary: `${b.valid} different ways found${b.bad.length ? ', ' + b.bad.length + ' lines did not make 20' : ''}. Child wrote: ${b.text.replace(/\n/g, '; ')}` }); S.stars += 3; save(); flash('Saved. +3 stars'); break; }
    case 'shopAdd': V.shop.items.push(+v); render(); break;
    case 'shopClear': V.shop.items = []; render(); break;
    case 'shopSave': { const b = V.shop.items.map(i => SHOP[i][0]).sort().join(' + '); if (!V.shop.baskets.includes(b)) V.shop.baskets.push(b); V.shop.items = []; render(); break; }
    case 'shopDone': S.tasks.push({ t: Date.now(), name: 'Shop with ₹20', summary: `${V.shop.baskets.length} different baskets: ${V.shop.baskets.join(' | ')}` }); S.stars += 3; save(); flash('Saved. +3 stars'); break;
    case 'detectSave': { const ans = [25, 32, 15]; let ok = 0; const parts = ans.map((x, i) => { const n = $('d' + i + 'n').value.trim(), r = $('d' + i + 'r').value.trim(); if (+n === x && n !== '') ok++; return `#${i + 1} next=${n || '-'} rule="${r || '-'}"`; }); S.tasks.push({ t: Date.now(), name: 'Pattern detective', summary: `${ok}/3 next numbers correct. ${parts.join('; ')}. Own pattern: ${$('dmine').value.trim() || '-'}` }); S.stars += 3; save(); flash(`${ok} of 3 next numbers correct. Saved.`); break; }
    case 'makerSave': { const cl = [1, 2, 3, 4].map(i => $('mk' + i).value.trim()), an = $('mkA').value.trim(); if (!an || cl.some(c => !c)) { flash('Fill in all four clues and the number.'); break; } S.tasks.push({ t: Date.now(), name: 'Mystery Number maker', summary: `Clues: ${cl.join(' / ')}. Answer: ${an}` }); S.stars += 3; save(); flash('Saved for your teacher. +3 stars'); break; }
    case 'lvl': { const s = el.dataset.s; S.levels[s] = Math.min(3, Math.max(1, lv(s) + (+el.dataset.d))); save(); render(); break; }
    case 'taught': break;
    case 'newMys': { const l = pick([2, 3]); const q = mystery(l); const m = q.visual.match(/<li>(.*?)<\/li>/g).map(x => x.replace(/<\/?li>/g, '')); V.mys = { clues: m, ans: q.answer }; render(); break; }
    case 'addRec': { const t = updateRubric(), sc = {}; DIMS.forEach(d => { sc[d[0]] = +document.querySelector(`input[name="d_${d[0]}"]:checked`).value; }); S.records.push({ t: Date.now(), skill: $('rSkill').value, ctx: $('rCtx').value, scores: sc, total: t, support: $('rSupport').value, obs: $('rObs').value.trim() }); save(); flash('Record added'); break; }
    case 'delRec': V.confirm = 'rec' + v; render(); break;
    case 'delRecYes': S.records.splice(+v, 1); V.confirm = null; save(); render(); break;
    case 'cancel': V.confirm = null; render(); break;
    case 'showReport': V.report = !V.report; render(); break;
    case 'copyReport': copyText(reportText()).then(ok => { if (ok) flash('Copied'); else { V.report = true; V.msg = 'Copy blocked here. Select the text below.'; render(); const b = $('repBox'); if (b) { const r = document.createRange(); r.selectNodeContents(b); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } } }); break;
    case 'reset': V.confirm = 'reset'; render(); break;
    case 'resetYes': S = def(); save(); V.confirm = null; V.msg = 'All progress deleted'; render(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'name') { S.name = t.value.trim() || 'Little Ramanujan'; save(); render(); }
  else if (t.id === 'wk') { V.wk = +t.value; }
  else if (t.dataset && t.dataset.act === 'taught') { S.taught[t.dataset.v] = t.checked; save(); }
  else if (t.closest && t.closest('#rubric')) updateRubric();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ans' && run && !run.done) cur().st.draft = t.value;
  if (t.id === 'expText' && run && !run.done) cur().st.expText = t.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ans') { e.preventDefault(); submit(e.target.value); } });
render();
})();</script>
